# The image's own settings, plus a scrape of the API's metrics port on the host
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - host.name
storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: hearth
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:9568"]
