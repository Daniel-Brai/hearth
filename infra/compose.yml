# Caddy is the only service with public ports

name: hearth

x-api: &api
  image: hearth-api
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  env_file: ${HEARTH_ENV_FILE:-../.env}
  environment:
    DATABASE_URL: ecto://hearth:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/hearth
    PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    # Caddy serves the local file store at /storage on the site's address
    API_URL: ${PUBLIC_URL}
    STORAGE_PATH: /data/storage
  volumes:
    - storage:/data/storage

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hearth
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    <<: *api
    command: ["/app/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    # Metrics for a scraper on this network only, Caddy doesn't route them
    expose:
      - "9568"
    # Browsers send voice media straight to RTC_PUBLIC_IP on these UDP ports
    ports:
      - "${RTC_PORT_RANGE:-50000-50199}:${RTC_PORT_RANGE:-50000-50199}/udp"
    # A stopping rtc node keeps its live sessions for up to two hours
    stop_grace_period: 2h5m
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  web:
    image: hearth-web
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # z labels the file for SELinux hosts
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # TURN over TLS on 5349 needs a certificate in turnserver.conf (cert and pkey)
  # and the port published here, so it is left out until then
  coturn:
    image: coturn/coturn:4.18.0-debian
    profiles: ["voice"]
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:-}
      - --external-ip=${RTC_PUBLIC_IP:-}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro,z
    restart: unless-stopped

volumes:
  postgres:
  storage:
  caddy_data:
  caddy_config:
