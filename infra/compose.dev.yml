# Mailpit catches every email, read its inbox at http://localhost:8025

services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
    restart: unless-stopped

  setup:
    environment: &mailpit
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: hearth
      SMTP_PASSWORD: hearth
      MAIL_FROM: hearth@localhost

  api:
    environment: *mailpit
    depends_on:
      mailpit:
        condition: service_started
