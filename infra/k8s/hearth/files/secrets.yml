# Variables the API reads from Vault and where, the path's first segment being
# the KV v2 mount and {env} the chart's secrets.env
# A missing value stops the boot unless it is optional, which leaves its feature off

DATABASE_URL:
  path: hearth/{env}/database
  key: url

SECRET_KEY_BASE:
  path: hearth/{env}/app
  key: secret_key_base
JWT_PRIVATE_KEY:
  path: hearth/{env}/app
  key: jwt_private_key
JWT_PREVIOUS_PUBLIC_KEYS:
  path: hearth/{env}/app
  key: jwt_previous_public_keys
  optional: true
ENCRYPTION_KEY:
  path: hearth/{env}/encryption
  key: key
ENCRYPTION_PREVIOUS_KEYS:
  path: hearth/{env}/encryption
  key: previous_keys
  optional: true
ENCRYPTION_HASH_KEY:
  path: hearth/{env}/encryption
  key: hash_key

# Keep the keys your MAIL_PROVIDER uses
SMTP_USERNAME:
  path: hearth/{env}/mail
  key: smtp_username
  optional: true
SMTP_PASSWORD:
  path: hearth/{env}/mail
  key: smtp_password
  optional: true
POSTMARK_API_KEY:
  path: hearth/{env}/mail
  key: postmark_api_key
  optional: true
ZEPTOMAIL_API_KEY:
  path: hearth/{env}/mail
  key: zeptomail_api_key
  optional: true
MAILGUN_API_KEY:
  path: hearth/{env}/mail
  key: mailgun_api_key
  optional: true
SENDGRID_API_KEY:
  path: hearth/{env}/mail
  key: sendgrid_api_key
  optional: true
BREVO_API_KEY:
  path: hearth/{env}/mail
  key: brevo_api_key
  optional: true
SES_ACCESS_KEY_ID:
  path: hearth/{env}/mail
  key: ses_access_key_id
  optional: true
SES_SECRET_ACCESS_KEY:
  path: hearth/{env}/mail
  key: ses_secret_access_key
  optional: true

S3_ACCESS_KEY_ID:
  path: hearth/{env}/storage
  key: access_key_id
S3_SECRET_ACCESS_KEY:
  path: hearth/{env}/storage
  key: secret_access_key

# Web push is off without both
VAPID_PUBLIC_KEY:
  path: hearth/{env}/push
  key: vapid_public_key
  optional: true
VAPID_PRIVATE_KEY:
  path: hearth/{env}/push
  key: vapid_private_key
  optional: true

# Each provider is off without both of its keys
GOOGLE_CLIENT_ID:
  path: hearth/{env}/oauth
  key: google_client_id
  optional: true
GOOGLE_CLIENT_SECRET:
  path: hearth/{env}/oauth
  key: google_client_secret
  optional: true
GITHUB_CLIENT_ID:
  path: hearth/{env}/oauth
  key: github_client_id
  optional: true
GITHUB_CLIENT_SECRET:
  path: hearth/{env}/oauth
  key: github_client_secret
  optional: true

# Signs TURN credentials, voice is off without it
TURN_SECRET:
  path: hearth/{env}/voice
  key: turn_secret
  optional: true

# For MODERATION_SCREENER hosted
OPENROUTER_API_KEY:
  path: hearth/{env}/ai
  key: openrouter_api_key
  optional: true

METRICS_USERNAME:
  path: hearth/{env}/metrics
  key: username
  optional: true
METRICS_PASSWORD:
  path: hearth/{env}/metrics
  key: password
  optional: true
GRAFANA_TOKEN:
  path: hearth/{env}/metrics
  key: grafana_token
  optional: true
