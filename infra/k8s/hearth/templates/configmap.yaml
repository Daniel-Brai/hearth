apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hearth.fullname" . }}-config
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- if eq .Values.secrets.source "vault" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hearth.fullname" . }}-secrets-map
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
data:
  secrets.yml: |-
    {{- .Files.Get "files/secrets.yml" | nindent 4 }}
{{- end }}
