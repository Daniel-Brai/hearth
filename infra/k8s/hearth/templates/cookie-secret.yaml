{{- if not .Values.cluster.existingSecret }}
{{- $name := include "hearth.cookieSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The Erlang cookie is needed before the VM starts, so it can't come from Vault
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hearth.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  cookie: {{ index $existing.data "cookie" }}
  {{- else }}
  cookie: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
