{{- $targets := list }}
{{- if and .Values.pools.web.enabled .Values.pools.web.autoscaling.enabled }}
{{- $targets = append $targets (dict "name" "api-web" "spec" .Values.pools.web.autoscaling) }}
{{- end }}
{{- if and .Values.web.enabled .Values.web.autoscaling.enabled }}
{{- $targets = append $targets (dict "name" "web" "spec" .Values.web.autoscaling) }}
{{- end }}
{{- range $targets }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hearth.fullname" $ }}-{{ .name }}
  labels:
    {{- include "hearth.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hearth.fullname" $ }}-{{ .name }}
  minReplicas: {{ .spec.minReplicas }}
  maxReplicas: {{ .spec.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .spec.targetCPUUtilizationPercentage }}
{{- end }}
